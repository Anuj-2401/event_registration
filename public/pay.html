<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complete your registration payment</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f7f7f9;
    text-align: center;
  }
  .card {
    background: white;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-width: 360px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e0e0e0;
    border-top-color: #3399cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { color: #c00; display: none; margin-top: 12px; }
  #retry { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p>Taking you to secure payment&hellip;</p>
    <p id="error"></p>
    <button id="retry" style="display:none">Try again</button>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("order_id");
  const key = params.get("key");
  const amount = params.get("amount");
  const name = params.get("name") || "";
  const email = params.get("email") || "";
  const phone = params.get("phone") || "";
  const responseId = params.get("response_id");

  function showError(msg) {
    document.querySelector(".spinner").style.display = "none";
    const err = document.getElementById("error");
    err.textContent = msg;
    err.style.display = "block";
    document.getElementById("retry").style.display = "inline-block";
  }

  function openCheckout() {
    if (!orderId || !key) {
      showError("Missing payment details. Please go back and submit the form again.");
      return;
    }

    const rzp = new Razorpay({
      key: key,
      amount: amount,
      currency: "INR",
      name: "Event Registration",
      description: "Registration fee",
      order_id: orderId,
      prefill: { name, email, contact: phone },
      notes: { response_id: responseId },
      handler: function () {
        // Payment succeeded from the browser's point of view.
        // The webhook is the source of truth for marking "Paid" in the
        // sheet, but we can show a friendly confirmation right away.
        window.location.href = "/thank-you.html";
      },
      modal: {
        ondismiss: function () {
          showError("Payment was cancelled. You can try again below.");
        },
      },
    });

    rzp.on("payment.failed", function (resp) {
      showError("Payment failed: " + resp.error.description);
    });

    rzp.open();
  }

  document.getElementById("retry").addEventListener("click", () => {
    document.getElementById("error").style.display = "none";
    document.getElementById("retry").style.display = "none";
    document.querySelector(".spinner").style.display = "block";
    openCheckout();
  });

  openCheckout();
</script>
</body>
</html>
